<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette contrast</title>
<style>
  :root { --paper: #F5F1E7; --ink: #22334E; --rule: #CBC4B4; --gray: #4A4A4A; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 Arial, Helvetica, sans-serif; color: var(--ink);
         background: #fff; height: 100vh; display: flex; flex-direction: column;
         padding: 2.2vh 2vw; }
  header { display: flex; align-items: baseline; gap: 1.4vw; flex-wrap: wrap; }
  h1 { font-size: clamp(15px, 2.1vw, 26px); margin: 0; }
  p { margin: 0; color: var(--gray); font-size: clamp(11px, 1.25vw, 16px); }
  .control { display: flex; align-items: center; gap: .8vw; margin: 2vh 0 1.6vh; }
  .control label { font-weight: 700; font-size: clamp(11px, 1.2vw, 15px); white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: #C24A2C; }
  output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3.4em;
           text-align: right; font-size: clamp(11px, 1.2vw, 15px); }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1vw; min-height: 0; }
  .sw { display: flex; flex-direction: column; border: 1px solid var(--rule); min-height: 0; }
  .fill { flex: 1; display: flex; align-items: center; justify-content: center;
          color: #fff; font-weight: 800; font-size: clamp(12px, 1.5vw, 20px); }
  .onpaper { background: var(--paper); padding: 1.4vh .7vw; font-weight: 700;
             font-size: clamp(11px, 1.3vw, 17px); }
  .row { display: flex; justify-content: space-between; align-items: center;
         padding: 1vh .7vw; border-top: 1px solid var(--rule);
         font-size: clamp(10px, 1.15vw, 14px); font-variant-numeric: tabular-nums; }
  .verdict { font-weight: 800; }
  .pass { color: #356B5D; }
  .fail { color: #A93B22; }
  footer { margin-top: 1.6vh; color: var(--gray); font-size: clamp(10px, 1.1vw, 14px); }
</style>
</head>
<body>
  <header>
    <h1>Palette contrast</h1>
    <p>Drag to darken every accent, and watch where each one crosses the 4.5:1 floor for text.</p>
  </header>

  <div class="control">
    <label for="k">Darken</label>
    <input id="k" type="range" min="0" max="45" value="0" step="1">
    <output id="kv">0%</output>
  </div>

  <div class="grid" id="grid"></div>

  <footer id="note"></footer>

<script>
// The kit's five accents, as they are defined in src/deck/deckTypes.ts.
const ACCENT = { red: "#C24A2C", teal: "#4A8375", gold: "#B08427", ink: "#22334E", gray: "#4A4A4A" };
const PAPER = "#F5F1E7";

const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const toHex = c => "#" + c.map(v => Math.round(v).toString(16).padStart(2,"0")).join("").toUpperCase();
const lum = c => {
  const [r,g,b] = c.map(v => { v /= 255; return v <= 0.03928 ? v/12.92 : ((v+0.055)/1.055)**2.4; });
  return 0.2126*r + 0.7152*g + 0.0722*b;
};
const ratio = (a,b) => { const [x,y] = [lum(a),lum(b)].sort((p,q)=>q-p); return (x+0.05)/(y+0.05); };
const darken = (c,k) => c.map(v => v * (1 - k));

const grid = document.getElementById("grid");
const cells = Object.entries(ACCENT).map(([name, base]) => {
  const el = document.createElement("div");
  el.className = "sw";
  el.innerHTML =
    '<div class="fill"></div>' +
    '<div class="onpaper">' + name + ' text</div>' +
    '<div class="row"><span class="hexv"></span><span class="verdict"></span></div>';
  grid.appendChild(el);
  return { name, base: hex(base), el };
});

const paper = hex(PAPER);
const slider = document.getElementById("k");
const kv = document.getElementById("kv");
const note = document.getElementById("note");

function draw() {
  const k = slider.value / 100;
  kv.textContent = slider.value + "%";
  let passing = 0;
  for (const c of cells) {
    const col = darken(c.base, k);
    const r = ratio(col, paper);
    const ok = r >= 4.5;
    if (ok) passing++;
    c.el.querySelector(".fill").style.background = toHex(col);
    c.el.querySelector(".fill").textContent = c.name;
    const t = c.el.querySelector(".onpaper");
    t.style.color = toHex(col);
    c.el.querySelector(".hexv").textContent = toHex(col) + "  " + r.toFixed(2) + ":1";
    const v = c.el.querySelector(".verdict");
    v.textContent = ok ? "passes" : "too light";
    v.className = "verdict " + (ok ? "pass" : "fail");
  }
  note.textContent = passing + " of " + cells.length +
    " clear 4.5:1 on the paper colour. This is why the kit ships a second, darker set of " +
    "accents for text: the mid-tones that look right as fills are unreadable projected.";
}

slider.addEventListener("input", draw);
draw();
</script>
</body>
</html>
